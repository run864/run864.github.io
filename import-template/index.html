<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>864 — Importa scheda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <p id="status">Apertura di 864 in corso…</p>
  <p id="fallback" style="display:none;">
    Non siamo riusciti ad aprire l'app automaticamente. Assicurati di avere
    864 installato, poi riapri questo link dal telefono.
  </p>
  <script>
    const id = new URLSearchParams(window.location.search).get("id");

    if (id) {
      // Niente "package=" apposta: serve solo a Chrome per cercare l'app
      // su Play Store quando la risoluzione fallisce (succede anche senza
      // S.browser_fallback_url esplicito, è un default). Senza, se nessuna
      // app risolve scheme+host non succede nulla — mai più redirect
      // inatteso allo store. La risoluzione dell'app installata (release,
      // debug, test, qualunque sia presente) avviene comunque tramite
      // scheme+host, che è dichiarato identico in tutte le varianti
      // perché vengono dallo stesso AndroidManifest.xml.
      let opened = false;
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) opened = true;
      });

      window.location.replace(
        "intent://import-template?id=" + encodeURIComponent(id) +
        "#Intent;scheme=864;end"
      );

      setTimeout(function () {
        if (!opened) {
          document.getElementById("status").style.display = "none";
          document.getElementById("fallback").style.display = "block";
        }
      }, 1500);
    } else {
      document.getElementById("status").textContent = "Link non valido.";
    }
  </script>
</body>
</html>
