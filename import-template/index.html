<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>864 — Importa scheda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <p id="status">Apertura di 864 in corso…</p>
  <p id="fallback" style="display:none;">
    Non siamo riusciti ad aprire l'app automaticamente. Assicurati di avere
    864 installato, poi riapri questo link dal telefono.
  </p>
  <script>
    const id = new URLSearchParams(window.location.search).get("id");

    if (id) {
      // "app864" (non "864"): niente più intent://, che si è rivelato
      // inaffidabile — semplice redirect diretto, perché "app864" è uno
      // schema URI valido (a differenza di "864", che inizia con una
      // cifra e che il browser non può navigare direttamente).
      let opened = false;
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) opened = true;
      });

      window.location.replace("app864://import-template?id=" + encodeURIComponent(id));

      setTimeout(function () {
        if (!opened) {
          document.getElementById("status").style.display = "none";
          document.getElementById("fallback").style.display = "block";
        }
      }, 1500);
    } else {
      document.getElementById("status").textContent = "Link non valido.";
    }
  </script>
</body>
</html>
