<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>864 — Importa scheda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <p id="status">Apertura di 864 in corso…</p>
  <p id="fallback" style="display:none;">
    Non siamo riusciti ad aprire l'app automaticamente. Assicurati di avere
    864 installato, poi riapri questo link dal telefono.
  </p>
  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    if (id) {
      // Nessun browser_fallback_url per ora: l'app non è ancora sullo
      // store, quindi un fallback automatico porterebbe solo a un
      // "elemento non trovato" confuso. Se dopo un breve timeout l'utente
      // è ancora su questa pagina (segno che l'intent non ha aperto
      // nulla), mostriamo il messaggio noi.
      const timer = setTimeout(function () {
        document.getElementById("status").style.display = "none";
        document.getElementById("fallback").style.display = "block";
      }, 1500);

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) clearTimeout(timer);
      });

      window.location.replace(
        "intent://import-template?id=" + encodeURIComponent(id) +
        "#Intent;scheme=864;package=com.example.a864test;end"
      );
    } else {
      document.getElementById("status").textContent = "Link non valido.";
    }
  </script>
</body>
</html>
